<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  <!-- halo -->
  <circle cx="100" cy="108" r="92" fill="#3B82F6" opacity="0.10"/>
  <circle cx="100" cy="108" r="76" fill="#3B82F6" opacity="0.12"/>
  <!-- tombol stopwatch -->
  <rect x="88" y="22" width="24" height="16" rx="3" fill="url(#ring)"/>
  <rect x="95" y="36" width="10" height="12" fill="url(#ring)"/>
  <g transform="rotate(-40 54 60)"><rect x="46" y="50" width="16" height="16" rx="3" fill="url(#ring)"/></g>
  <g transform="rotate(40 146 60)"><rect x="138" y="50" width="16" height="16" rx="3" fill="url(#ring)"/></g>
  <!-- badan stopwatch -->
  <circle cx="100" cy="112" r="60" fill="url(#ring)"/>
  <circle cx="100" cy="112" r="47" fill="#FFFFFF"/>
  <!-- tanda tanya -->
  <path d="M84 98 a16 16 0 1 1 24 14 c-6 3.5 -8 7 -8 13 v3" fill="none"
        stroke="url(#mark)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="100" cy="143" r="6.5" fill="#38BDF8"/>
</svg>
